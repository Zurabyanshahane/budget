<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Budget</title>
<meta name="theme-color" content="#f2f2f0">
<script>try{var t=localStorage.getItem('budget_theme');if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#111113':'#f2f2f0';}}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Radius-Regel: Karten 16px, Chips/Buttons/Tabs Pill, Tasten 14px */
:root{
  --bg:#f2f2f0; --surface:#fbfbfa; --surface2:#e9e9e6; --line:#dcdcd8;
  --text:#18181b; --muted:#6b6b72; --faint:#9a9aa1;
  --accent:#16795b; --accent-soft:#d9efe6; --on-accent:#fbfbfa;
  --warn:#b4432f; --warn-soft:#f6e1dc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111113; --surface:#1b1b1e; --surface2:#26262a; --line:#323237;
    --text:#ececee; --muted:#a2a2aa; --faint:#6f6f77;
    --accent:#3fb98f; --accent-soft:#16352b; --on-accent:#0d1f19;
    --warn:#e2725d; --warn-soft:#3a1f1a;
  }
}
:root[data-theme="dark"]{
    --bg:#111113; --surface:#1b1b1e; --surface2:#26262a; --line:#323237;
    --text:#ececee; --muted:#a2a2aa; --faint:#6f6f77;
    --accent:#3fb98f; --accent-soft:#16352b; --on-accent:#0d1f19;
    --warn:#e2725d; --warn-soft:#3a1f1a;
}
html{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface2);border-radius:999px;padding:4px;margin:0 14px 14px}
.seg button{height:36px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100dvh}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.app{max-width:460px;margin:0 auto;min-height:100dvh;padding:0 16px calc(96px + env(safe-area-inset-bottom));
  padding-top:calc(10px + env(safe-area-inset-top))}
.sync-note{font-size:12px;color:var(--muted);text-align:center;padding:4px 0 8px;display:flex;justify-content:center;align-items:center;gap:6px}
.sync-note.err{color:var(--warn)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.addbox select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px}
.row.tap{cursor:pointer}
.row.tap:active{background:var(--surface2)}
.btn2{height:40px;border-radius:999px;background:var(--surface2);color:var(--text);font-weight:600;padding:0 14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px}
.login{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.login[hidden]{display:none}
.login-card{width:100%;max-width:380px;display:grid;gap:12px}
.login-card h1{margin:0 0 6px;font-size:26px;text-align:center}
.login-icon{width:64px;height:64px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:34px;margin:0 auto 4px}
.login-card label{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.login-card label[hidden]{display:none}
.login-card input{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:12px;font:inherit;font-size:16px;outline:none}
.login-card input:focus{border-color:var(--accent)}
.login-info{min-height:18px;font-size:14px;color:var(--muted);text-align:center}
.login-card .btn,.login-card .btn2{height:48px}
.link{color:var(--accent);font-size:14px;padding:6px}
.link[hidden],.btn2[hidden]{display:none}
.keybox{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;color:var(--muted);padding:0 14px 4px}
.screen{display:none}
.screen.on{display:block;animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen.on{animation:none}}

/* Tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabbar-in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--faint);padding:4px 0;white-space:nowrap}
.tab i{font-size:24px}
.crow.on{background:var(--accent-soft)}
.yhint{font-size:12.5px;color:var(--muted);margin:6px 4px 0}
.tab.on{color:var(--accent)}

/* Eintragen */
.datebar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 6px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500}
.pill input{position:absolute;opacity:0;pointer-events:none;width:0}
.left-small{font-size:13px;color:var(--muted)}
.left-small b{color:var(--text)}
.amount-wrap{display:flex;justify-content:center;align-items:baseline;gap:6px;margin:10px 0 2px}
.amount{width:4.5ch;border:0;border-bottom:2px solid var(--line);background:none;color:var(--text);text-align:center;
  font-family:inherit;font-size:48px;font-weight:650;line-height:1.15;letter-spacing:-1px;padding:0 0 2px;outline:none}
.amount:focus{border-bottom-color:var(--accent)}
.amount::placeholder{color:var(--faint)}
.amount-wrap span{font-size:28px;font-weight:600;color:var(--muted)}
.refund-row{display:flex;justify-content:center;margin-top:8px}
.refund-tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface2);border-radius:999px;padding:6px 12px}
.refund-tog.on{background:var(--accent-soft);color:var(--accent)}
.amount.neg{color:var(--accent)}
.v.refund{color:var(--accent)}
.addbox .chkrow{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text)}
.addbox .chkrow input{width:20px;height:20px;accent-color:var(--accent)}
.hint{text-align:center;font-size:13px;color:var(--muted);min-height:18px;margin:8px 0 14px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 6px;font-size:13.5px;
  font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .12s,background .15s}
.cat:active{transform:scale(.97)}
.cat.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.note{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;
  padding:10px 16px;font:inherit;font-size:15px;margin-bottom:10px;outline:none}
.note:focus{border-color:var(--accent)}
.note::placeholder{color:var(--muted)}
.save{width:100%;height:46px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:16px;
  font-weight:600;margin-top:4px;transition:opacity .15s,transform .1s}
.save:disabled{opacity:.35}
.save:not(:disabled):active{transform:scale(.98)}
h3{font-size:13px;font-weight:600;color:var(--muted);margin:26px 4px 8px}
.list{background:var(--surface);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted)}
.row .v{font-weight:600}

/* Monat */
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.monthbar h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.3px}
.round{width:38px;height:38px;border-radius:999px;background:var(--surface);display:grid;place-items:center;font-size:18px}
.round:disabled{opacity:.3}
.hero{background:var(--surface);border-radius:16px;padding:18px 18px 16px}
.hero .lbl{font-size:13px;color:var(--muted)}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-1px;margin:2px 0 4px}
.hero .big.neg{color:var(--warn)}
.hero .sub{font-size:13.5px;color:var(--muted)}
.sheet{background:var(--surface);border-radius:16px;margin-top:12px;overflow:hidden}
.grid3{display:grid;grid-template-columns:1fr 100px 100px;font-size:15px;align-items:center;padding:11px 14px;gap:6px}
.grid3+.grid3{border-top:1px solid var(--line)}
.grid3.head{font-size:12px;color:var(--muted);font-weight:600;padding-top:10px;padding-bottom:8px}
.grid3 .r{text-align:right}
.grid3.total{font-weight:700;background:var(--surface2)}
.grid3 .over{color:var(--warn)}
.section{background:var(--surface);border-radius:16px;margin-top:12px;overflow:hidden}
.sec-h{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px;text-align:left}
.sec-h .t{font-weight:650}
.sec-h .s{font-size:13px;color:var(--muted)}
.sec-h i{color:var(--faint);transition:transform .2s;margin-left:8px}
.section.open .sec-h i{transform:rotate(180deg)}
.sec-b{display:none;border-top:1px solid var(--line)}
.section.open .sec-b{display:block}
.crow{display:block;width:100%;text-align:left;padding:11px 14px}
.crow+.crow{border-top:1px solid var(--line)}
.crow .top{display:flex;justify-content:space-between;gap:10px}
.crow .top span:last-child{color:var(--muted);font-size:14px}
.crow .top b{color:var(--text);font-weight:600}
.bar{height:5px;border-radius:999px;margin-top:7px;background:var(--surface2);overflow:hidden}
.bar>div{height:100%;background:var(--accent);border-radius:999px}
.bar>div.over{background:var(--warn)}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px}

/* Grafiken */
.chart-card{background:var(--surface);border-radius:16px;margin-top:12px;padding:14px}
.chart-card .t{font-weight:650;margin-bottom:8px}
.chart-box{position:relative;height:210px}
.donuts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px}
.donut{background:var(--surface);border-radius:16px;padding:14px 12px;min-width:0}
.donut canvas{max-width:100%}
.period{text-align:center;font-size:13px;color:var(--muted);margin:-8px 0 12px}
.cat.biz{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.cat.biz.on{color:var(--on-accent);border-style:solid}
.biz-hero{margin-top:12px;background:var(--accent-soft)}
.tax-line{display:flex;justify-content:space-between;font-size:14px;margin-top:8px;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.donut .t{font-weight:650;font-size:14px;margin-bottom:8px}
.donut .ring{position:relative;height:118px}
.donut .mid{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:20px;pointer-events:none}
.donut .leg{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.6}
.donut .leg b{color:var(--text);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:6px;vertical-align:1px}

/* Einstellungen */
.page-title{font-size:22px;font-weight:700;letter-spacing:-.3px;margin:8px 4px 4px}
.amt-in{width:96px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:7px 9px;
  font:inherit;font-size:15px;text-align:right;outline:none}
.amt-in:focus{border-color:var(--accent)}
.addrow{display:grid;grid-template-columns:1fr 96px 40px;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface2)}
.addrow input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 10px;font:inherit;font-size:15px;outline:none}
.addrow input:focus{border-color:var(--accent)}
.addrow input[inputmode]{text-align:right}
.addbtn{border-radius:999px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:17px;height:38px}
.addbox{background:var(--surface);border-radius:16px;padding:14px;margin-top:12px;display:grid;gap:10px}
.addbox label{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.addbox label{min-width:0}
.addbox input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;outline:none}
.addbox input:focus{border-color:var(--accent)}
.addbox .two{display:grid;grid-template-columns:1fr 120px;gap:10px}
.btn{height:44px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600}
.btn:disabled{opacity:.35}
.plan-btn{width:100%;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface);color:var(--accent);border:1.5px solid var(--accent)}
.plan-btn.on{background:var(--accent);color:var(--on-accent)}
.grid3 .amt-in{width:100%;justify-self:end}
.fxrow{display:grid;grid-template-columns:26px 1fr 84px 84px;gap:8px;align-items:center;padding:10px 14px}
.fxrow+.fxrow{border-top:1px solid var(--line)}
.fxrow .amt-in{width:100%;padding:6px 7px;font-size:14px}
.fxrow.head{font-size:12px;color:var(--muted);font-weight:600;padding-top:10px;padding-bottom:6px}
.fxrow .r{text-align:right}

/* Fix & Schulden */
.chk{width:26px;height:26px;border-radius:999px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:15px;color:transparent;transition:background .15s,border-color .15s}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.debt{background:var(--surface);border-radius:16px;padding:16px;margin-top:12px}
.debt .t{font-weight:650;font-size:17px}
.debt .s{font-size:13.5px;color:var(--muted);margin-top:2px}
.debt .bar{height:8px;margin:14px 0 6px}
.debt .legend{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.mcell{border-radius:12px;background:var(--surface2);padding:8px 4px;text-align:center;font-size:12px;color:var(--muted)}
.mcell b{display:block;font-size:13px;color:var(--text);font-weight:600}
.mcell.paid{background:var(--accent-soft)}
.mcell.paid b{color:var(--accent)}
.note-box{font-size:13px;color:var(--muted);padding:10px 4px 0}

/* Bottom sheet + toast */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.bsheet{position:fixed;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding:10px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:31;max-height:78dvh;overflow:auto}
.bsheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 12px}
.bsheet h2{font-size:18px;margin:0 4px 12px}
.del{color:var(--warn);font-size:20px;padding:4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;
  background:var(--text);color:var(--bg);border-radius:999px;padding:10px 10px 10px 18px;font-size:14px;display:flex;gap:12px;align-items:center;
  transition:opacity .2s,transform .2s;z-index:40;pointer-events:none;max-width:calc(100% - 32px);width:max-content}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
</style>
</head>
<body>
<div class="app">
  <div class="sync-note" id="syncNote"></div>

  <!-- Eintragen -->
  <section class="screen on" id="s-add">
    <div class="datebar">
      <label class="pill"><i class="ph ph-calendar-blank"></i><span id="dateLbl">Heute</span>
        <input type="date" id="dateIn"></label>
      <div class="left-small" id="leftSmall"></div>
    </div>
    <label class="amount-wrap"><input class="amount num" id="amount" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Betrag"><span>€</span></label>
    <div class="refund-row"><button class="refund-tog" id="refundTog" aria-pressed="false"><i class="ph ph-arrow-u-up-left"></i> Rückerstattung</button></div>
    <div class="hint" id="hint">Betrag tippen, dann Kategorie wählen</div>
    <div class="cats" id="cats"></div>
    <input class="note" id="note" placeholder="Notiz (optional)" autocomplete="off">
    <button class="save" id="save" disabled>Speichern</button>
    <h3>Zuletzt eingetragen</h3>
    <div class="list" id="recent"></div>
  </section>

  <!-- Monat -->
  <section class="screen" id="s-month">
    <div class="monthbar">
      <button class="round" id="mPrev" aria-label="Vorheriger Monat"><i class="ph ph-caret-left"></i></button>
      <h1 id="mTitle"></h1>
      <button class="round" id="mNext" aria-label="Nächster Monat"><i class="ph ph-caret-right"></i></button>
    </div>
    <div id="monthBody"></div>
  </section>

  <!-- Jahr -->
  <section class="screen" id="s-year">
    <div class="monthbar">
      <button class="round" id="yPrev" aria-label="Vorheriges Jahr"><i class="ph ph-caret-left"></i></button>
      <h1 id="yTitle"></h1>
      <button class="round" id="yNext" aria-label="Nächstes Jahr"><i class="ph ph-caret-right"></i></button>
    </div>
    <div id="yearBody"></div>
  </section>

  <!-- Fix & Schulden -->
  <section class="screen" id="s-fix">
    <div class="monthbar">
      <button class="round" id="fPrev" aria-label="Vorheriger Monat"><i class="ph ph-caret-left"></i></button>
      <h1 id="fTitle"></h1>
      <button class="round" id="fNext" aria-label="Nächster Monat"><i class="ph ph-caret-right"></i></button>
    </div>
    <div id="fixBody"></div>
  </section>

  <!-- Einstellungen -->
  <section class="screen" id="s-set">
    <div class="page-title">Einstellungen</div>
    <div class="note-box" style="padding-top:2px">Deine Standard-Beträge für jeden neuen Monat. Änderungen gelten ab diesem Monat, vergangene Monate bleiben, wie sie waren.</div>
    <div id="setBody"></div>
  </section>
</div>

<nav class="tabbar"><div class="tabbar-in">
  <button class="tab on" data-s="s-add"><i class="ph ph-plus-circle"></i>Eintragen</button>
  <button class="tab" data-s="s-month"><i class="ph ph-chart-pie-slice"></i>Monat</button>
  <button class="tab" data-s="s-year"><i class="ph ph-chart-bar"></i>Jahr</button>
  <button class="tab" data-s="s-fix"><i class="ph ph-house-line"></i>Fix &amp; Schulden</button>
  <button class="tab" data-s="s-set"><i class="ph ph-gear-six"></i>Einstellungen</button>
</div></nav>

<div class="login" id="login" hidden>
  <div class="login-card">
    <div class="login-icon"><i class="ph-bold ph-currency-eur"></i></div>
    <h1 id="lgTitle">Budget</h1>
    <label id="lgEmailRow">E-Mail<input id="lgEmail" type="email" autocomplete="username" inputmode="email" autocapitalize="off"></label>
    <label>Passwort<input id="lgPw" type="password" autocomplete="current-password"></label>
    <div class="login-info" id="lgInfo" role="status"></div>
    <button class="btn" id="lgMain">Anmelden</button>

<script>

const emptyState = () => ({v:3, exp:[], cats:[], months:{}, T:{fixKosten:[],income:[],savings:[],schulden:[],steuer:[]},
  hist:{}, starts:{}, dayNotes:{}, debt:{name:'Ratenplan',total:0,plan:[],otherPaid:0}, cfgAt:0});
let D = (() => { try { const x = JSON.parse(localStorage.getItem(LS)); if(x && x.v===3) return x; } catch(_){} return emptyState(); })();
const VAR = ['Einkaufen Lebensmittel','Lunch','Essen draußen','Coffee','Other'];
const NICE = {'Einkaufen Lebensmittel':'Lebensmittel','DM & Cosmetics':'Beauty / DM','Other':'Sonstiges'};
const nice = c => NICE[c] || c;
const MN = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const eur = new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const eur0 = new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0});

const grp = n => (catOf(n)||{}).group || 'variable';
const today = iso(new Date());

/* Monat m läuft bis zum Tag vor dem Beginn des nächsten Monats.
   Excel-Monate haben ihre festen Zeiträume (D.starts), alle anderen beginnen am 1. */
const addM = (m,k) => { let y=+m.slice(0,4), mo=+m.slice(5)+k; while(mo>12){mo-=12;y++;} while(mo<1){mo+=12;y--;} return y+'-'+pad2(mo); };
function startOf(m){
  return D.starts[m] || m+'-01';
}
function endOf(m){ const d = new Date(startOf(addM(m,1))+'T12:00'); d.setDate(d.getDate()-1); return iso(d); }
function monthOf(date){
  const m = date.slice(0,7);
  if(date >= startOf(addM(m,1))) return addM(m,1);
  if(date < startOf(m)) return addM(m,-1);
  return m;
}
const fmtD = s => new Date(s+'T12:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
let thisMonth;
function assignMonths(){ exp = D.exp.filter(e => !e.del); exp.forEach(e => e.m = e.xm || monthOf(e.date)); thisMonth = monthOf(today); }
assignMonths();

/* Monatsliste */
function allMonths(){
  const s = new Set([...exp.map(e=>e.m), ...Object.keys(D.hist), ...Object.keys(D.months), thisMonth]);
  return [...s].sort();
}
let month = thisMonth;

/* Kategorien nach Häufigkeit (letzte 6 Monate) */
function catOrder(){
  const since = iso(new Date(Date.now()-183*864e5));
  const cnt = {};
  D.cats.filter(c => !c.hidden).forEach(c => cnt[c.name]=0);
  exp.forEach(e => { if(e.date>=since && e.cat in cnt) cnt[e.cat]++; });
  return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
}

/* Neuer Monat: aus den Vorlagen anlegen, Rollover = Balance vom Vormonat */
function ensureMonth(m){
  if(D.months[m] || D.hist[m] || m < '2026-05') return;
  const ms = allMonths(), prev = ms[ms.indexOf(m)-1];
  if(prev) ensureMonth(prev);
  const roll = prev ? Math.round(summary(prev).bal.a*100)/100 : 0;
  const item = (x, key) => ({name:x.name, budget:x.amount, actual: key==='income' ? x.amount : 0});
  D.months[m] = {
    income:[...D.T.income.map(x=>item(x,'income')), {name:'Rollover',budget:roll,actual:roll}],
    savings:D.T.savings.map(x=>item(x)), fixKosten:D.T.fixKosten.map(x=>item(x)), schulden:D.T.schulden.map(x=>item(x)),
    steuer:(D.T.steuer||[]).map(x=>item(x)), autoRoll:true
  };
}

/* Vorlage (Einstellungen) auf diesen und spätere Monate übertragen; Ist-Werte und Rollover bleiben */
function applyTpl(key){
  Object.keys(D.months).filter(m => m >= thisMonth).forEach(m => {
    const old = Object.fromEntries((D.months[m][key]||[]).map(x=>[x.name,x]));
    const list = D.T[key].map(x => ({name:x.name, budget:x.amount,
      actual: old[x.name] ? old[x.name].actual : (key==='income' ? x.amount : 0)}));
    if(old.Rollover) list.push(old.Rollover);
    D.months[m][key] = list;
  });
}

/* Budget einer Kategorie: pro Monat planbar, sonst Standard aus den Einstellungen */
function bud(m, c){
  const cb = D.months[m] && D.months[m].catBudgets;
  return cb && c in cb ? cb[c] : ((catOf(c)||{}).budget||0);
}

/* Monatsrechnung wie in der Excel */
function summary(m){
  const app = D.months[m], h = D.hist[m];
  const tot = (arr,k) => arr.reduce((s,x)=>s+(+x[k]||0),0);
  const es = exp.filter(e => e.m===m);
  const byCat = {};
  es.forEach(e => byCat[e.cat] = (byCat[e.cat]||0) + e.amt);
  const cb = (app && app.catBudgets) || {};
  const cats = [...new Set([...D.cats.map(c=>c.name), ...Object.keys(byCat), ...Object.keys(cb).filter(c=>cb[c])])];
  const shown = c => !hid(c) || byCat[c] || cb[c];
  const varCats = cats.filter(c => grp(c)!=='business' && shown(c));
  const bizCats = cats.filter(c => grp(c)==='business' && shown(c));
  const sumA = cs => cs.reduce((s,c)=>s+(byCat[c]||0),0);
  const sumB = cs => cs.reduce((s,c)=>s+bud(m,c),0);
  let inc, sav, fix, sch, varB, tax={b:0,a:0};
  if(app && app.autoRoll){
    const r = app.income.find(x => x.name==='Rollover'), prev = addM(m,-1);
    if(r){ const v = Math.round(summary(prev).bal.a*100)/100; r.budget = v; r.actual = v; }
  }
  let bizB = sumB(bizCats);
  if(app){
    inc={b:tot(app.income,'budget'),a:tot(app.income,'actual')};
    sav={b:tot(app.savings,'budget'),a:tot(app.savings,'actual')};
    fix={b:tot(app.fixKosten,'budget'),a:tot(app.fixKosten,'actual')};
    sch={b:tot(app.schulden,'budget'),a:tot(app.schulden,'actual')};
    tax={b:tot(app.steuer||[],'budget'),a:tot(app.steuer||[],'actual')};
    varB=sumB(varCats);
  } else if(h){
    const g = k => h[k] || {budget:0,actual:0};
    const S = h['Notfall & Savings'] || h['Savings'] || {budget:0,actual:0};
    inc={b:g('Income').budget+g('Rollover').budget, a:g('Income').actual+g('Rollover').actual};
    sav={b:S.budget,a:S.actual};
    fix={b:g('Fix Kosten').budget,a:g('Fix Kosten').actual};
    sch={b:g('Schulden').budget,a:g('Schulden').actual};
    varB=g('Variable Kosten').budget + g('Kassen').budget; bizB=0;
  } else {
    inc={b:D.T.income.reduce((s,x)=>s+x.amount,0),a:0};
    sav={b:0,a:0};
    const fb=D.T.fixKosten.reduce((s,x)=>s+x.amount,0);
    fix={b:fb,a:0}; sch={b:0,a:0};
    varB=sumB(varCats);
  }
  const vr={b:varB,a:sumA(varCats)}, biz={b:bizB,a:sumA(bizCats)};
  const bal = {
    b: inc.b-(sav.b+fix.b+vr.b+biz.b+tax.b+sch.b),
    a: inc.a-(sav.a+fix.a+vr.a+biz.a+tax.a+sch.a)
  };
  return {inc,sav,fix,vr,biz,tax,sch,bal,byCat,varCats,bizCats,es,hasDetail:!!app};
}

/* ---------- Eintragen ---------- */
let selCat = null, entryDate = today, refund = false;

/* ---------- Monat ---------- */
function renderMonth(){
  ensureMonth(month);
  const ms = allMonths(), i = ms.indexOf(month);
  $('mTitle').textContent = mLabel(month);
  $('mPrev').disabled = i<=0; $('mNext').disabled = i>=ms.length-1;
  const s = summary(month);
  const spent = s.vr.a;
  const budget = s.vr.b;
  const rows = [
    ['Einkommen', s.inc], ['Sparen', s.sav], ['Fix Kosten', s.fix],
    ['Variable Kosten', s.vr], ['alef studio', s.biz], ['Steuer (alef)', s.tax], ['Schulden', s.sch]
  ];
  const cell = (o,isOut) => {
    const over = isOut && o.a > o.b + 0.005 && o.b>0;
    return `<span class="r num">${f(o.b)}</span><span class="r num${over?' over':''}">${f(o.a)}</span>`;
  };
  const app = D.months[month];
  let html = `<div class="period">${fmtD(startOf(month))} bis ${fmtD(endOf(month))}</div>
    <div class="hero">
      <div class="lbl">Übrig diesen Monat</div>
      <div class="big num${s.bal.a<0?' neg':''}">${f(s.bal.a)}</div>
      <div class="sub">${f0(spent)} von ${f0(budget)} für Variable Kosten ausgegeben</div>
    </div>
    <div class="sheet">
      <div class="grid3 head"><span>Bereich</span><span class="r">Budget</span><span class="r">Ist</span></div>
      ${rows.map(([n,o],k)=>`<div class="grid3"><span>${n}</span>${cell(o,k>0)}</div>`).join('')}
      <div class="grid3 total"><span>Balance</span><span class="r num">${f(s.bal.b)}</span><span class="r num">${f(s.bal.a)}</span></div>
    </div>
    <div class="chart-card"><div class="t">Summary</div><div class="chart-box"><canvas id="cBar"></canvas></div></div>
    <div class="donuts">
      <div class="donut"><div class="t">Ausgegeben</div><div class="ring"><canvas id="cD1"></canvas><div class="mid num" id="cD1m"></div></div><div class="leg" id="cD1l"></div></div>
      <div class="donut"><div class="t">Verplant</div><div class="ring"><canvas id="cD2"></canvas><div class="mid num" id="cD2m"></div></div><div class="leg" id="cD2l"></div></div>
    </div>`;
  if(app) html += `<button class="btn plan-btn${planMode?' on':''}" id="planBtn"><i class="ph ph-pencil-simple"></i> ${planMode?'Fertig':'Budget planen'}</button>`;
  else html += `<div class="note-box">Für diesen Monat gibt es aus der Excel nur Summen, deshalb kann er nicht neu geplant werden.</div>`;
  if(app) html += itemSection('Einkommen', 'income', s.inc);
  html += catSection('Variable Kosten', s.varCats, s);
  html += catSection('alef studio', s.bizCats, s);
  if(app){ app.steuer = app.steuer || []; html += itemSection('Steuer zurücklegen', 'steuer', s.tax); }
  if(app){ html += itemSection('Sparen', 'savings', s.sav); html += itemSection('Schulden', 'schulden', s.sch); }
  $('monthBody').innerHTML = html;
  drawCharts(s);
}
let planMode = false;
const numIn = (key, v) => `<input class="amt-in num" data-pk="${key}" inputmode="decimal" value="${fmtIn(v||0)}">`;
function itemSection(title, key, tot){
  const items = D.months[month][key];
  const body = `<div class="grid3 head"><span>Posten</span><span class="r">Budget</span><span class="r">Ist</span></div>` +
    items.map((x,k) => planMode
      ? `<div class="grid3"><span>${esc(x.name)}</span>${numIn(key+'|'+k+'|budget',x.budget)}${numIn(key+'|'+k+'|actual',x.actual)}</div>`
      : `<div class="grid3"><span>${esc(x.name)}</span><span class="r num">${f(x.budget)}</span><span class="r num">${f(x.actual)}</span></div>`).join('');
  return `<div class="section${openSecs.has(title)||planMode?' open':''}" data-sec="${title}">
    <button class="sec-h"><span class="t">${title}</span>
      <span><span class="s num">${f(tot.a)} / ${f(tot.b)}</span><i class="ph ph-caret-down"></i></span></button>
    <div class="sec-b">${body}</div></div>`;
}

/* Grafiken wie in den Excel-Monatsblättern */
let charts = [];
function drawCharts(s){
  charts.forEach(c => c.destroy()); charts = [];
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  const out = o => s.sav[o]+s.fix[o]+s.vr[o]+s.biz[o]+s.tax[o]+s.sch[o];
  const ring = (id, used, total, usedLbl, freeLbl) => {
    const free = total - used;
    $(id+'m').textContent = total>0 ? Math.round(used/total*100)+'%' : '-';
    $(id+'l').innerHTML = `<div><span class="dot" style="background:${v('--accent')}"></span>${usedLbl} <b class="num">${f0(used)}</b></div>
      <div><span class="dot" style="background:${free<0?v('--warn'):v('--line')}"></span>${freeLbl} <b class="num">${f0(free)}</b></div>`;
    if(!window.Chart) return;
    charts.push(new Chart($(id), {type:'doughnut',
      data:{datasets:[{data:[Math.max(0,used), Math.max(0,free)], backgroundColor:[v('--accent'), v('--line')], borderWidth:0}]},
      options:{responsive:true, maintainAspectRatio:false, cutout:'72%', animation:false,
        plugins:{legend:{display:false}, tooltip:{enabled:false}}}}));
  };
  ring('cD1', out('a'), s.inc.a, 'Ausgegeben', 'Übrig');
  ring('cD2', out('b'), s.inc.b, 'Verplant', 'Noch frei');
  if(!window.Chart) return;
  const os = [s.inc, s.sav, s.fix, s.vr, s.biz, s.tax, s.sch];
  charts.push(new Chart($('cBar'), {type:'bar',
    data:{labels:['Einkommen','Sparen','Fix','Variabel','alef','Steuer','Schulden'], datasets:[
      {label:'Budget', data:os.map(o=>o.b), backgroundColor:v('--line'), borderRadius:5},
      {label:'Ist', data:os.map(o=>o.a), backgroundColor:v('--accent'), borderRadius:5}]},
    options:{responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{legend:{position:'bottom', labels:{color:v('--muted'), boxWidth:10, boxHeight:10, useBorderRadius:true, borderRadius:5}},
        tooltip:{callbacks:{label:c => c.dataset.label+': '+f(c.raw)}}},
      scales:{x:{ticks:{color:v('--muted'), font:{size:10}, maxRotation:0, autoSkip:false}, grid:{display:false}},
        y:{ticks:{color:v('--faint'), font:{size:10}, callback:x=>f0(x)}, grid:{color:v('--surface2')}, border:{display:false}}}}}));
}
const openSecs = new Set(['Variable Kosten']);
function catSection(title, cats, s){
  const a = cats.reduce((x,c)=>x+(s.byCat[c]||0),0);
  const b = cats.reduce((x,c)=>x+bud(month,c),0);
  const body = cats.map(c => {
    const ca = s.byCat[c]||0, cb = bud(month,c);
    if(planMode) return `<div class="grid3"><span>${esc(nice(c))}</span>${numIn('cat|'+c,cb)}<span class="r num">${f(ca)}</span></div>`;
    const p = Math.max(0, cb>0 ? Math.min(100, ca/cb*100) : (ca>0?100:0));
    return `<button class="crow" data-cat="${esc(c)}"><div class="top"><span>${esc(nice(c))}</span>
      <span class="num"><b>${f(ca)}</b>${cb?' / '+f0(cb):''}</span></div>
      <div class="bar"><div class="${ca>cb?'over':''}" style="width:${p}%"></div></div></button>`;
  }).join('');
  const head = planMode ? `<div class="grid3 head"><span>Kategorie</span><span class="r">Budget</span><span class="r">Ist</span></div>` : '';
  return `<div class="section${openSecs.has(title)||planMode?' open':''}" data-sec="${title}">
    <button class="sec-h"><span><span class="t">${title}</span></span>
      <span class="sec-h-r"><span class="s num">${f(a)} / ${f(b)}</span><i class="ph ph-caret-down"></i></span></button>
    <div class="sec-b">${head}${body}</div></div>`;
}
$('monthBody').onchange = e => {
  const k = e.target.dataset.pk; if(!k) return;

  if(!(v>=0)) return renderMonth();
  const val = Math.round(v*100)/100, p = k.split('|');
  if(p[0]==='cat'){ app.catBudgets = app.catBudgets || {}; app.catBudgets[p[1]] = val; }
  else app[p[0]][+p[1]][p[2]] = val;
  changed();
};
$('monthBody').onclick = e => {

  const h = e.target.closest('.sec-h');

function openCat(cat){
  const es = exp.filter(e => e.m===month && e.cat===cat).sort((a,b)=>b.date.localeCompare(a.date)||(b.u||0)-(a.u||0));

/* ---------- Konto & Sync über Supabase (Login mit E-Mail und Passwort) ---------- */
const sb = (window.supabase && SB_URL.startsWith('https://'))
  ? supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:'budget_auth'}})
  : null;
let user = null;
const syncOn = () => !!(sb && user);
let syncStatus = '', lastSync = 0, syncing = false, again = false;
function setSync(st){
  syncStatus = st;
  const t = {ok:'Gespeichert · synchron', run:'Synchronisiere …', off:'Offline · auf dem Gerät gespeichert',
             err:'Sync-Fehler · auf dem Gerät gespeichert', local:'Auf diesem Gerät gespeichert (kein Sync)'}[st] || '';
  const ic = {ok:'ph-cloud-check', run:'ph-cloud-arrow-up', off:'ph-cloud-slash', err:'ph-warning-circle', local:'ph-device-mobile'}[st] || 'ph-cloud';
  $('syncNote').innerHTML = `<i class="ph ${ic}"></i>${t}`;
  $('syncNote').classList.toggle('err', st==='err');
  if($('syncState')) $('syncState').textContent = t;
}
const CFG = ['cats','months','T','hist','starts','dayNotes','debt'];
/* Zusammenführen: Einträge einzeln (neuester Stand gewinnt), Planung/Einstellungen als Ganzes */
function merge(r){
  let got = false;
  const map = new Map(D.exp.map(e => [e.id, e]));
  (r.exp||[]).forEach(x => { const l = map.get(x.id); if(!l || (x.u||0) > (l.u||0)){ map.set(x.id, x); got = true; } });
  D.exp = [...map.values()];
  if((r.cfgAt||0) > (D.cfgAt||0)){ CFG.forEach(k => { if(k in r) D[k] = r[k]; }); D.cfgAt = r.cfgAt; got = true; }
  return got;
}
async function sync(){
  if(!syncOn()){ setSync('local'); return; }
  if(syncing){ again = true; return; }
  syncing = true; setSync('run');
  try {
    const {data:row, error} = await sb.from('budget_data').select('data').maybeSingle();
    if(error) throw error;
    const remote = row && row.data;
    if(remote && merge(remote)){ persist(); refreshAll(); }
    const rmap = new Map(((remote && remote.exp) || []).map(x => [x.id, x]));
    const localNewer = !remote || (D.cfgAt||0) > (remote.cfgAt||0) ||
      D.exp.some(e => { const x = rmap.get(e.id); return !x || (e.u||0) > (x.u||0); });
    if(localNewer && (D.exp.length || D.cats.length)){
      const {error:e2} = await sb.from('budget_data').upsert({user_id:user.id, data:clean(), updated_at:new Date().toISOString()});
      if(e2) throw e2;
    }
    lastSync = Date.now(); setSync('ok');
  } catch(err) { console.warn(err); setSync(navigator.onLine === false ? 'off' : 'err'); }
  syncing = false;
  if(again){ again = false; sync(); }
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') sync(); });
window.addEventListener('online', sync);
setInterval(() => { if(document.visibilityState === 'visible') sync(); }, 60000);

/* ---------- Anmelden ---------- */
const appUrl = () => location.origin + location.pathname;
const authMsg = m => ({'Invalid login credentials':'E-Mail oder Passwort ist falsch.',
  'Email not confirmed':'Bitte zuerst den Link in der Bestätigungs-E-Mail antippen.',
  'User already registered':'Für diese E-Mail gibt es schon ein Konto. Bitte anmelden.'}[m] || m);
function showLogin(mode){
  const L = $('login'); L.hidden = false; L.dataset.mode = mode;
  $('lgTitle').textContent = mode === 'reset' ? 'Neues Passwort' : 'Budget';
  $('lgEmailRow').hidden = mode === 'reset';
  $('lgMain').textContent = mode === 'reset' ? 'Passwort speichern' : 'Anmelden';
  $('lgAlt').hidden = $('lgForgot').hidden = mode === 'reset';
  $('lgPw').autocomplete = mode === 'reset' ? 'new-password' : 'current-password';
  $('lgPw').value = ''; $('lgInfo').textContent = mode === 'reset' ? 'Wähle ein neues Passwort (mindestens 8 Zeichen).' : '';
}
const hideLogin = () => { $('login').hidden = true; };
async function lgSubmit(kind){
  const email = $('lgEmail').value.trim(), pw = $('lgPw').value, mode = $('login').dataset.mode;
  const info = t => { $('lgInfo').textContent = t; };
  try {
    if(mode === 'reset'){
      if(pw.length < 8) return info('Bitte mindestens 8 Zeichen.');
      const {error} = await sb.auth.updateUser({password:pw}); if(error) throw error;
      hideLogin(); toast('Neues Passwort gespeichert'); return;
    }
    if(!/^\S+@\S+\.\S+$/.test(email)) return info('Bitte eine gültige E-Mail eingeben.');
    if(kind === 'forgot'){
      const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo:appUrl()}); if(error) throw error;
      return info('Wir haben dir eine E-Mail zum Zurücksetzen geschickt.');
    }
    if(pw.length < 8) return info('Das Passwort braucht mindestens 8 Zeichen.');
    if(kind === 'signup'){
      const {data, error} = await sb.auth.signUp({email, password:pw, options:{emailRedirectTo:appUrl()}}); if(error) throw error;
      if(!data.session) return info('Fast geschafft: Bitte den Link in der E-Mail antippen, dann hier anmelden.');
    } else {
      const {error} = await sb.auth.signInWithPassword({email, password:pw}); if(error) throw error;
    }
  } catch(err) { info(authMsg(err.message || String(err))); }
}
async function afterLogin(){
  hideLogin();
  if(D.owner && D.owner !== user.id){ D = emptyState(); }   // anderes Konto: fremde Daten nicht übernehmen
  D.owner = user.id; persist(); refreshAll();
  await sync();
  if(!D.exp.length && !D.cats.length) welcome();
}
async function logout(){
  if(!confirm('Abmelden? Deine Daten werden von diesem Gerät entfernt und bleiben in deinem Konto.')) return;
  await sync();
  await sb.auth.signOut();
  try { localStorage.removeItem(LS); } catch(_){}
  user = null; D = emptyState(); refreshAll(); showLogin('login');
}
function initAuth(){
  if(!sb){ setSync('local'); if(!D.exp.length && !D.cats.length) welcome(); return; }
  showLogin('login');
  sb.auth.onAuthStateChange((ev, session) => {
    if(ev === 'PASSWORD_RECOVERY'){ user = session && session.user; showLogin('reset'); return; }
    const u = session ? session.user : null;
    if(u && (!user || u.id !== user.id)){ user = u; setTimeout(afterLogin, 0); }
    else if(!u){ user = null; showLogin('login'); }
  });
}

/* ---------- Eintrag bearbeiten ---------- */
function openEdit(id){
  const e = D.exp.find(x => x.id === id); if(!e) return;
  const cats = [...new Set([...D.cats.filter(c => !c.hidden).map(c => c.name), e.cat])];
  $('bsBody').innerHTML = `<h2>Eintrag bearbeiten</h2>
    <div class="addbox" style="margin-top:0">
      <label>Betrag<input id="edAmt" inputmode="decimal" value="${fmtIn(Math.abs(e.amt))}"></label>
      <label class="chkrow"><input type="checkbox" id="edRefund"${e.amt<0?' checked':''}> Rückerstattung (wird von der Kategorie abgezogen)</label>
      <label>Datum<input id="edDate" type="date" value="${e.date}"></label>
      <label>Kategorie<select id="edCat">${cats.map(c => `<option value="${esc(c)}"${c===e.cat?' selected':''}>${esc(nice(c))}</option>`).join('')}</select></label>
      <label>Notiz<input id="edNote" value="${esc(e.note||'')}" autocomplete="off"></label>
      <button class="btn" id="edSave">Speichern</button>
      <button class="btn danger" id="edDel"><i class="ph ph-trash"></i> Löschen</button>
    </div>`;
  $('bsBody').dataset.cur = id;
  openSheet();
}
function saveEdit(){
  const e = D.exp.find(x => x.id === $('bsBody').dataset.cur); if(!e) return;
  const v = parseAmt($('edAmt').value), date = $('edDate').value;
  if(!(v > 0)) return toast('Bitte einen Betrag eingeben');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return toast('Bitte ein Datum wählen');
  if(date !== e.date) delete e.xm;   // neues Datum: Monat neu bestimmen
  Object.assign(e, {amt:($('edRefund').checked ? -1 : 1) * Math.round(v*100)/100, date, cat:$('edCat').value, note:$('edNote').value.trim(), u:Date.now()});
  closeSheet(); changed('exp'); toast('Eintrag gespeichert');
}
function deleteEdit(){
  const e = D.exp.find(x => x.id === $('bsBody').dataset.cur); if(!e) return;
  e.del = true; e.u = Date.now(); closeSheet(); changed('exp');
  toast(`${f(e.amt)} ${nice(e.cat)} gelöscht`, () => { e.del = false; e.u = Date.now(); changed('exp'); });
}

/* ---------- Backup ---------- */
function downloadBackup(){
  const blob = new Blob([JSON.stringify(clean(), null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `budget_backup_${today}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function loadFile(file, isStart){
  const rd = new FileReader();
  rd.onload = () => {
    let x; try { x = JSON.parse(rd.result); } catch(_) { return toast('Die Datei ist kein gültiges Backup'); }
    if(!x || x.v !== 3 || !Array.isArray(x.exp)) return toast('Die Datei ist kein gültiges Backup');
    if(!isStart && !confirm(`Backup mit ${x.exp.filter(e=>!e.del).length} Einträgen laden? Der jetzige Stand auf diesem Gerät wird ersetzt.`)) return;
    D = x; D.cfgAt = Date.now(); D.exp.forEach(e => { if(isStart) e.u = e.u || 0; });
    month = thisMonth; persist(); closeSheet(); refreshAll();
    if(user) D.owner = user.id;
    persist(); sync();
    toast(isStart ? 'Daten geladen' : 'Backup geladen');
  };
  rd.readAsText(file);
}
const pickFile = isStart => { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
  i.onchange = () => i.files[0] && loadFile(i.files[0], isStart); i.click(); };

/* ---------- Einstellungen: Sync & Backup ---------- */
function themeBlock(){
  const cur = document.documentElement.dataset.theme || 'auto';
  const b = (v, ic, t) => `<button data-theme-set="${v}" class="${cur===v?'on':''}"><i class="ph ${ic}"></i>${t}</button>`;
  return `<div class="section open"><div class="sec-h" style="cursor:default"><span class="t">Darstellung</span></div>
    <div class="seg" role="group" aria-label="Darstellung">${b('light','ph-sun','Hell')}${b('dark','ph-moon','Dunkel')}${b('auto','ph-circle-half','Auto')}</div></div>`;
}
function setTheme(v){
  if(v === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v;
  try { v === 'auto' ? localStorage.removeItem('budget_theme') : localStorage.setItem('budget_theme', v); } catch(_){}
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  refreshAll();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(!document.documentElement.dataset.theme) setTheme('auto'); });
function syncBlock(){
  return `<div class="section open"><div class="sec-h" style="cursor:default"><span class="t">Konto &amp; Backup</span></div>
    <div class="sec-b">
    ${user ? `<div class="row"><span class="grow"><span class="t">Angemeldet</span><div class="s">${esc(user.email||'')}</div></span></div>` : ''}
    <div class="row"><span class="grow"><span class="t">Status</span><div class="s" id="syncState"></div></span></div>
    ${user ? `<div class="btnrow"><button class="btn2" id="syncNow"><i class="ph ph-arrows-clockwise"></i> Jetzt synchronisieren</button>
      <button class="btn2" id="pwNew"><i class="ph ph-key"></i> Passwort ändern</button>
      <button class="btn2" id="logout"><i class="ph ph-sign-out"></i> Abmelden</button></div>` : ''}
    <div class="btnrow" style="border-top:1px solid var(--line)"><button class="btn2" id="bkDown"><i class="ph ph-download-simple"></i> Backup herunterladen</button>
      <button class="btn2" id="bkUp"><i class="ph ph-upload-simple"></i> Backup laden</button></div></div></div>`;
}
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-theme-set]'); if(tb) return setTheme(tb.dataset.themeSet);
  const id = (e.target.closest('button')||{}).id;
  if(id === 'syncNow') sync();
  else if(id === 'pwNew') showLogin('reset');
  else if(id === 'logout') logout();
  else if(id === 'bkDown') downloadBackup();
  else if(id === 'bkUp') pickFile(false);
  else if(id === 'startFile') pickFile(true);
  else if(id === 'lgMain') lgSubmit('login');
  else if(id === 'lgAlt') lgSubmit('signup');
  else if(id === 'lgForgot') lgSubmit('forgot');
});
$('lgPw').addEventListener('keydown', e => { if(e.key === 'Enter') lgSubmit('login'); });

/* ---------- Erster Start ---------- */
function welcome(){
  $('bsBody').innerHTML = `<h2>Willkommen</h2>
    <div class="note-box" style="padding:0 4px 12px">In deinem Konto sind noch keine Daten. Lade einmal deine Startdatei (Budget-Startdaten.json) oder ein Backup. Danach ist alles auf all deinen Geräten.</div>
    <div class="addbox" style="margin-top:0"><button class="btn" id="startFile"><i class="ph ph-file-arrow-up"></i> Startdatei oder Backup laden</button></div>`;
  openSheet();
}

if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
setDateLbl(); refreshAll(); setSync('local'); initAuth();
</script>
